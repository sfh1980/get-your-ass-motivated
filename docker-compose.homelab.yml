# Local proof of Phase A shape (app + unpublished-style db network).
# Usage: docker compose -f docker-compose.homelab.yml up --build
# App: http://localhost:4070  (Postgres not published on host)

services:
  db:
    image: postgres:16-alpine
    container_name: gyam-homelab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gyam
      POSTGRES_PASSWORD: gyam
      POSTGRES_DB: gyam
    volumes:
      - gyam_homelab_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gyam -d gyam"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: gyam-app:local
    container_name: gyam-homelab-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4070:4070"
    environment:
      NODE_ENV: production
      HOST: "0.0.0.0"
      API_PORT: "4070"
      SERVE_WEB: "true"
      DATABASE_URL: postgresql://gyam:gyam@db:5432/gyam
      WEB_ORIGIN: http://localhost:4070
      SESSION_DAYS: "30"
      COOKIE_SECURE: "false"
    volumes:
      - gyam_homelab_uploads:/app/data/uploads

volumes:
  gyam_homelab_pgdata:
  gyam_homelab_uploads:
