name: Publish GYAM image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema apps/api/prisma/schema.prisma
      - run: npm run build

  publish-image:
    runs-on: ubuntu-latest
    needs: [build-check]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Set short SHA tag
        id: meta
        run: |
          short_sha="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER}/gyam-app" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.short_sha }}
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:homelab
          labels: |
            org.opencontainers.image.title=gyam-app
            org.opencontainers.image.description=GYAM API + PWA (Express single-origin)
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report package visibility
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          package_name="gyam-app"
          encoded_name="$(printf '%s' "${package_name}" | jq -sRr @uri)"
          vis="$(gh api "/user/packages/container/${encoded_name}" --jq .visibility || echo unknown)"
          echo "Package visibility: ${vis}"
          echo "Published ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.short_sha }} (+ :latest :homelab)"
          if [ "${vis}" != "public" ]; then
            echo "Private/unknown package — TrueNAS needs a PAT with read:packages."
          fi
